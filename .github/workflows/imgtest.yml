name: imgtest
on: { push: { branches: [img-test], paths: [".github/workflows/imgtest.yml", "exp/**"] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node exp/test.mjs > out.txt 2>&1 || true
      - run: |
          git config user.name t; git config user.email t@t
          git add out.txt gn.html; git commit -m "test output"; git push
