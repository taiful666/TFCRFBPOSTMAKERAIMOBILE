<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: file:">
<title>TF Media Studio</title>
<style>
:root{--bg:#0a1330;--ink:#eaf0ff;--mute:#93a5d1;--gold:#f5bd3c;--teal:#1fb6a6;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;font-family:"Noto Sans Bengali","Nirmala UI","Segoe UI",sans-serif;user-select:none}
body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
.row{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:18px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:15px;letter-spacing:.2px}.brand b i{font-style:normal;color:var(--gold)}
.tab{border:0;background:transparent;color:var(--mute);padding:9px 20px;border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;transition:.15s}
.tab:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.tab.on{background:linear-gradient(135deg,#1c3a7a,#1a5f86);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--gold);color:#1b1500;border-radius:999px;font-size:12px;font-weight:800;padding:0 8px;min-width:20px;text-align:center;display:none}
.sp{flex:1}
#toast{position:fixed;right:14px;top:62px;max-width:380px;background:#0a1330;border:1px solid var(--teal);color:var(--ink);padding:9px 14px;border-radius:11px;font-size:13px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:default;z-index:9}
#toast.clk{cursor:pointer}
</style></head>
<body>
<div class="row">
  <div class="brand"><img src="logo.png" alt=""><b><i>TF</i> Media Studio</b></div>
  <button class="tab" data-t="hub"><svg viewBox="0 0 24 24"><path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>খবর<span class="badge" id="bg"></span></button>
  <button class="tab" data-t="news"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>ভিডিও</button>
  <button class="tab" data-t="post"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.6"/><path d="M5 17l5-5 4 4 2-2 3 3"/></svg>পোস্ট ও রিল</button>
  <div class="sp"></div>
</div>
<div id="toast"></div>
<script>
const BN='০১২৩৪৫৬৭৮৯';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tf.switchTab(b.dataset.t));
tf.onState(s=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===s.tab));
  const g=document.getElementById('bg');g.style.display=s.count?'inline-block':'none';g.textContent=String(s.count).replace(/\d/g,d=>BN[d]);
});
let tt=null;
tf.onToast(t=>{const el=document.getElementById('toast');el.textContent=t.msg;el.style.display='block';el.className=t.folder?'clk':'';
  el.onclick=t.folder?()=>{tf.showFile(t.folder);el.style.display='none'}:null;clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',t.folder?7000:3500)});
</script>
</body></html>
